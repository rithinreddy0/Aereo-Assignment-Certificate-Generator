services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CERT_DATA_DIR: /app/data
      CERT_API_KEY: ${CERT_API_KEY:-}
    volumes:
      - certificate-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      CERT_DATA_DIR: /app/data
    volumes:
      - certificate-data:/app/data
    restart: unless-stopped
volumes:
  certificate-data:

