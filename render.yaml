services:
  - type: web
    name: folio-api
    runtime: python
    plan: free
    buildCommand: pip install -c requirements.lock .
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: CERT_DATA_DIR
        value: /tmp/folio
      - key: CERT_EMBEDDED_WORKER
        value: "true"
      - key: CERT_MAX_RECIPIENTS
        value: "500"
      - key: CERT_POLL_SECONDS
        value: "5"
