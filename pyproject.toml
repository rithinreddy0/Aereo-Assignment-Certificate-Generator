[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bulk-certificate-generator"
version = "1.1.0"
description = "A small, durable FastAPI service for bulk PDF certificates"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "email-validator>=2.2,<3",
  "reportlab>=4.3,<5",
  "filelock>=3.17,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "pypdf>=5,<7", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

